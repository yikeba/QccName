plugins {
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'java'
    id 'org.jetbrains.kotlin.jvm'
}

group = 'chat.qube'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Netty + RocksDB + BouncyCastle（抗量子）
    implementation 'io.netty:netty-all:4.1.114.Final'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.78.1'
    implementation 'org.bouncycastle:bcpg-jdk18on:1.78.1'  // 这行必须加！PQC依赖它
    // 2. Alibaba Fastjson2 —— 你点名要的！全球最硬最快JSON库！
    implementation("com.alibaba.fastjson2:fastjson2:2.0.52")

   /* implementation 'org.iq80.leveldb:leveldb:0.12'
    implementation 'org.iq80.leveldb:leveldb-api:0.12'*/
    // LZ4 压缩库（高性能）
    implementation 'org.lz4:lz4-java:1.8.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
}

tasks.named('bootJar') {
    archiveFileName = 'qubechain-node.jar'
}

tasks.named('test') {
    useJUnitPlatform()
}
kotlin {
    jvmToolchain(23)
}